name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ==========================================
      # Environment information
      # ==========================================
      - name: Show versions
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Xcode:"
          xcodebuild -version


      # ==========================================
      # Install NPM packages
      # ==========================================
      - name: Install dependencies
        run: npm install


      # ==========================================
      # Build React / Vite
      # ==========================================
      - name: Build Web App
        run: npm run build


      # ==========================================
      # Make sure Capacitor iOS package exists
      # ==========================================
      - name: Install Capacitor iOS
        run: |
          npm install @capacitor/ios


      # ==========================================
      # Remove incomplete iOS project
      # ==========================================
      - name: Remove old incomplete iOS project
        run: |
          echo "Removing old incomplete ios folder..."

          rm -rf ios

          echo "Old ios folder removed."


      # ==========================================
      # Create fresh iOS project
      # ==========================================
      - name: Create iOS Project
        run: |
          echo "Creating fresh Capacitor iOS project..."

          npx cap add ios

          echo ""
          echo "iOS project created."
          echo ""

          ls -la ios
          ls -la ios/App


      # ==========================================
      # Capacitor Sync
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync ios


      # ==========================================
      # Verify Xcode project
      # ==========================================
      - name: Verify Xcode Project
        run: |
          echo "Checking Xcode project..."

          ls -la ios/App

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: App.xcodeproj still not found!"
            exit 1
          fi

          echo ""
          echo "App.xcodeproj FOUND successfully."


      # ==========================================
      # CocoaPods
      # ==========================================
      - name: Install CocoaPods
        run: |
          cd ios/App

          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          if [ -f "Podfile" ]; then

            echo ""
            echo "Podfile found."
            echo ""

            pod install --repo-update

          else

            echo "No Podfile found."
            echo "Skipping CocoaPods."

          fi


      # ==========================================
      # Detect workspace/project
      # ==========================================
      - name: Detect Xcode Build Type
        id: detect
        run: |

          if [ -d "ios/App/App.xcworkspace" ]; then

            echo "type=workspace" >> $GITHUB_OUTPUT

            echo "Using App.xcworkspace"

          elif [ -d "ios/App/App.xcodeproj" ]; then

            echo "type=project" >> $GITHUB_OUTPUT

            echo "Using App.xcodeproj"

          else

            echo "No Xcode project found!"
            exit 1

          fi


      # ==========================================
      # Show available schemes
      # ==========================================
      - name: Show Xcode Schemes
        run: |

          if [ -d "ios/App/App.xcworkspace" ]; then

            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -list

          else

            xcodebuild \
              -project ios/App/App.xcodeproj \
              -list

          fi


      # ==========================================
      # Build using Workspace
      # ==========================================
      - name: Build iOS App - Workspace
        if: steps.detect.outputs.type == 'workspace'
        run: |

          set -o pipefail

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build


      # ==========================================
      # Build using Project
      # ==========================================
      - name: Build iOS App - Project
        if: steps.detect.outputs.type == 'project'
        run: |

          set -o pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build


      # ==========================================
      # Locate generated .app
      # ==========================================
      - name: Locate App
        run: |

          echo "Searching for generated .app..."

          find build -name "*.app" -type d -print

          APP_PATH=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: No .app generated!"
            exit 1

          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          echo ""
          echo "Found:"
          echo "$APP_PATH"


      # ==========================================
      # Create Payload
      # ==========================================
      - name: Create Payload
        run: |

          rm -rf Payload

          mkdir Payload

          cp -R "$APP_PATH" Payload/

          echo ""
          echo "Payload created:"
          ls -la Payload


      # ==========================================
      # Create IPA
      # ==========================================
      - name: Create IPA
        run: |

          rm -f AlertNet-Unsigned.ipa

          zip -r \
            AlertNet-Unsigned.ipa \
            Payload

          echo ""
          echo "====================================="
          echo "IPA CREATED SUCCESSFULLY"
          echo "====================================="
          echo ""

          ls -lh AlertNet-Unsigned.ipa


      # ==========================================
      # Upload IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlertNet-iOS-Unsigned
          path: AlertNet-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30