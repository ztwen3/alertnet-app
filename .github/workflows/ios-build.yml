name: Build AlertNet iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Environment
        run: |
          node --version
          npm --version
          xcodebuild -version

      # تنظيف أي dependencies قديمة
      - name: Clean Dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      # عرض الإصدارات الفعلية
      - name: Check Capacitor
        run: |
          npm list @capacitor/core @capacitor/ios @capacitor/local-notifications @capacitor/push-notifications
          npx cap doctor || true

      # بناء React/Vite
      - name: Build Web App
        run: npm run build

      # نحذف مشروع iOS القديم لأنه ناقص
      - name: Create Fresh iOS Project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      # التأكد من أن Xcode project تم إنشاؤه
      - name: Verify iOS Project
        run: |
          echo "=== ios/App ==="
          ls -la ios/App

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: App.xcodeproj not found"
            exit 1
          fi

          echo "App.xcodeproj OK"

      # عرض الـ schemes
      - name: Check Xcode Project
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -list

      # بناء التطبيق بدون Apple signing
      - name: Build Unsigned App
        run: |
          set -o pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee xcode-build.log

      # العثور على App.app
      - name: Find App
        run: |
          echo "Searching for .app..."

          find build -name "*.app" -type d -print

          APP_PATH=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      # إنشاء IPA
      - name: Create IPA
        run: |
          rm -rf Payload
          rm -f AlertNet-Unsigned.ipa

          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -r AlertNet-Unsigned.ipa Payload

          echo "=============================="
          echo "IPA CREATED"
          echo "=============================="

          ls -lh AlertNet-Unsigned.ipa

      # رفع IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlertNet-iOS-Unsigned
          path: AlertNet-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # في حالة فشل Xcode يعرض الخطأ الحقيقي
      - name: Show Xcode Errors
        if: failure()
        run: |
          if [ -f xcode-build.log ]; then
            echo "========== XCODE ERRORS =========="
            grep -n -E "error:|fatal error:" xcode-build.log | tail -100 || true
          fi