name: Build iOS IPA (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node.js
      # لا نستخدم npm cache لأن package-lock.json غير موجود
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ==========================================
      # 3. Show versions
      # ==========================================
      - name: Show environment versions
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Xcode:"
          xcodebuild -version

      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # 5. Build Web App
      # ==========================================
      - name: Build Web App
        run: npm run build

      # ==========================================
      # 6. Check iOS project
      # ==========================================
      - name: Check iOS Project
        run: |
          echo "Checking ios folder..."

          ls -la
          ls -la ios || true
          ls -la ios/App || true

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: ios/App/App.xcodeproj not found!"
            exit 1
          fi

          echo "App.xcodeproj found successfully."

      # ==========================================
      # 7. Capacitor Sync
      # ==========================================
      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      # ==========================================
      # 8. Check Podfile
      # ==========================================
      - name: Check Podfile
        run: |
          echo "Podfile contents:"
          cat ios/App/Podfile

          echo ""
          echo "Files inside ios/App:"
          ls -la ios/App

      # ==========================================
      # 9. Install CocoaPods
      # ==========================================
      - name: Install CocoaPods
        run: |
          cd ios/App

          echo "Current directory:"
          pwd

          echo "Installing CocoaPods..."

          pod install --repo-update

      # ==========================================
      # 10. Check generated workspace
      # ==========================================
      - name: Check Xcode Workspace
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "ERROR: App.xcworkspace was not generated!"
            exit 1
          fi

          echo "Workspace found:"
          ls -la ios/App/App.xcworkspace

          echo ""
          echo "Available schemes:"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -list

      # ==========================================
      # 11. Build unsigned iOS application
      # ==========================================
      - name: Build Unsigned iOS App
        run: |
          set -o pipefail

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # ==========================================
      # 12. Find App.app
      # ==========================================
      - name: Find Built App
        run: |
          echo "Searching for App.app..."

          find build -name "*.app" -type d -print

          APP_PATH="build/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app was not generated."
            exit 1
          fi

          echo "App found:"
          ls -la "$APP_PATH"

      # ==========================================
      # 13. Create Payload
      # ==========================================
      - name: Create Payload
        run: |
          rm -rf Payload

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            Payload/App.app

          echo "Payload:"
          ls -la Payload/App.app

      # ==========================================
      # 14. Create IPA
      # ==========================================
      - name: Create Unsigned IPA
        run: |
          rm -f AlertNet-Unsigned.ipa

          zip -r \
            AlertNet-Unsigned.ipa \
            Payload

          echo ""
          echo "================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh AlertNet-Unsigned.ipa

      # ==========================================
      # 15. Upload IPA
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlertNet-iOS-Unsigned
          path: AlertNet-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30