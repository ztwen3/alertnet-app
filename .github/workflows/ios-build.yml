name: Build iOS IPA (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # بناء مشروع الويب
      - name: Build Web App
        run: npm run build

      # إضافة منصة ios أو تحديثها وتوليد ملفات Xcode تلقائياً
      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap copy ios

      # الانتقال لمجلد التطبيق وتشغيل pod install
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # بناء ملف IPA غير موثق (Unsigned IPA)
      - name: Build Unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: App-Unsigned.ipa